[project]
name = "archaeo-scan"
version = "0.39.0"
description = "Local find context and archaeological research planning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Only what the app imports (verified by tracing every import reachable from atlas/gui/app.py, 11 Nov 2026).
    "dash>=4.1,<4.2",
    "dash-leaflet>=1.1.3,<1.2",
    "dash-extensions>=2.0,<3",
    "flask>=3.1.2,<3.2",
    "pillow>=11,<13",
    "pydantic>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.32.5,<3",
    "defusedxml>=0.7.1",
    "rasterio>=1.4,<2",  # old topo sheets laid over the map (core/topo_overlay.py)
]

[project.optional-dependencies]
# Private data-acquisition collectors (collectors/, tools/build_offline_counties.py); the app never imports them.
collectors = ["geopandas>=0.14", "fiona>=1.9", "httpx>=0.24"]

[project.scripts]
clovis-plan = "cli.discovery:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*", "cli*", "collectors*", "core*", "tools*"]

[tool.setuptools.package-data]
"atlas.gui.data" = ["*.sqlite", "us_places_2026.csv", "data_pack_catalog.json", "offline-publications/*/*.json", "offline-publications/*/*.xml", "offline-publications/*/*.xlsx", "offline-publications/*/*.docx", "offline-publications/*/*.zip", "offline-publications/*/*.png"]
"atlas.gui" = ["assets/*.css", "assets/*.js", "assets/*.json", "assets/*.svg", "assets/*.png"]

[tool.setuptools.exclude-package-data]
# Optional collections since 11 Nov 2026 (Atlas > Manage offline collections), not core install data.
"atlas.gui.data" = ["fossil_references_*.sqlite", "smithsonian_objects_*.sqlite", "smithsonian_reference_index.sqlite"]

