[project]
name = "archaeo-scan"
version = "0.15.0"
description = "Local find context and archaeological research planning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "requests>=2.32.5,<3",
    "dash>=4.1,<4.2",
    "dash-leaflet>=1.1.3,<1.2",
    "dash-bootstrap-components>=2.0,<2.1",
    "flask>=3.1.2,<3.2",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "fiona>=1.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "h3>=3.7",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
lidar = ["pdal>=3.2", "laspy>=2.5"]
nlp = ["anthropic>=0.25"]
analytics = ["duckdb>=0.9"]

[project.scripts]
archaeo = "cli.main:app"
clovis-plan = "cli.discovery:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*", "citizen*", "cli*", "collectors*", "core*", "nlp*", "processors*", "tools*"]

[tool.setuptools.package-data]
"atlas.gui.data" = ["*.sqlite", "us_places_2026.csv", "data_pack_catalog.json"]
"atlas.gui" = ["assets/*.css", "assets/*.js", "assets/*.json", "assets/*.svg", "assets/*.png"]
"atlas" = ["frontend/index.html", "frontend/src/*.js", "frontend/src/*.tsx", "frontend/styles/*.css"]

